<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Be a Rich SMC Journal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0d1117; 
      color: #c9d1d9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .glass-card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
    }
    .custom-scroll::-webkit-scrollbar { width: 6px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12 custom-scroll selection:bg-emerald-500/30 selection:text-white">

  <!-- TOP HEADER -->
  <header class="border-b border-gray-800 bg-[#0d1117] sticky top-0 z-40 px-6 py-4 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div class="bg-emerald-500 text-white p-2 rounded-xl shadow-lg shadow-emerald-500/20">
        <i data-lucide="activity" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-xl leading-tight text-white flex items-center gap-2 tracking-wide">
          Be a Rich 
          <span class="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 px-2 py-0.5 rounded-full font-mono font-semibold tracking-wider">SMC JOURNAL</span>
        </h1>
        <p class="text-xs text-gray-400 mt-0.5">Smart Money & Price Action Execution Logger</p>
      </div>
    </div>

    <div class="flex items-center gap-3">
      <button onclick="clearJournal()" class="flex items-center text-sm bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/20 px-4 py-2 rounded-lg transition font-medium">
        <i data-lucide="trash-2" class="w-4 h-4 mr-2"></i>
        Günlüğü Sıfırla
      </button>
      <button onclick="exportData()" class="flex items-center text-sm bg-[#21262d] hover:bg-[#30363d] text-gray-300 border border-gray-700 px-4 py-2 rounded-lg transition font-medium">
        <i data-lucide="download" class="w-4 h-4 mr-2"></i>
        Yedek Al
      </button>
      <button onclick="openModal()" class="flex items-center text-sm bg-emerald-500 hover:bg-emerald-400 text-gray-900 px-4 py-2 rounded-lg transition font-bold shadow-lg shadow-emerald-500/20">
        <i data-lucide="plus" class="w-4 h-4 mr-1"></i>
        Yeni İşlem Ekle
      </button>
    </div>
  </header>

  <main class="max-w-[1600px] w-full mx-auto px-6 mt-8 space-y-6">

    <!-- STATS ROW -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
      
      <!-- Net R -->
      <div class="glass-card p-5 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-semibold text-gray-400 tracking-wider">KÜMÜLATİF NET R</span>
          <div class="bg-emerald-500/10 p-1.5 rounded text-emerald-400"><i data-lucide="trophy" class="w-4 h-4"></i></div>
        </div>
        <div>
          <span id="statNetR" class="text-4xl font-bold text-emerald-400 tracking-tight">0.0R</span>
          <p id="statAvgR" class="text-xs text-gray-500 mt-2 font-medium">Ort. R/Trade: 0.00R</p>
        </div>
      </div>

      <!-- Win Rate -->
      <div class="glass-card p-5 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-semibold text-gray-400 tracking-wider">WİN RATE</span>
          <div class="bg-blue-500/10 p-1.5 rounded text-blue-400"><i data-lucide="target" class="w-4 h-4"></i></div>
        </div>
        <div>
          <span id="statWinRate" class="text-4xl font-bold text-white tracking-tight">0%</span>
          <p id="statWL" class="text-xs text-gray-500 mt-2 font-medium"><span class="text-emerald-400">0W</span> / <span class="text-rose-400">0L</span> / 0BE</p>
        </div>
      </div>

      <!-- Toplam İşlem -->
      <div class="glass-card p-5 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-semibold text-gray-400 tracking-wider">TOPLAM İŞLEM</span>
          <div class="bg-purple-500/10 p-1.5 rounded text-purple-400"><i data-lucide="layers" class="w-4 h-4"></i></div>
        </div>
        <div>
          <span id="statTotalTrades" class="text-4xl font-bold text-white tracking-tight">0</span>
          <p class="text-xs text-gray-500 mt-2 font-medium">Kayıtlı SMC İşlemi</p>
        </div>
      </div>

      <!-- En Başarılı Model -->
      <div class="glass-card p-5 flex flex-col justify-between relative overflow-hidden">
        <div class="flex justify-between items-start mb-2">
          <span class="text-xs font-semibold text-gray-400 tracking-wider">EN BAŞARILI MODEL</span>
          <div class="bg-pink-500/10 p-1.5 rounded text-pink-400"><i data-lucide="sparkles" class="w-4 h-4"></i></div>
        </div>
        <div>
          <span id="statBestModel" class="text-2xl font-bold text-white tracking-tight block truncate">-</span>
          <p class="text-xs text-gray-500 mt-2 font-medium">En yüksek R getiren model</p>
        </div>
      </div>

      <!-- Graf -->
      <div class="glass-card p-4 relative overflow-hidden flex flex-col">
        <div class="flex justify-between items-center mb-1">
          <span class="text-xs font-semibold text-gray-400 tracking-wider flex items-center gap-1">
            <i data-lucide="trending-up" class="w-3 h-3 text-emerald-400"></i> R BÜYÜME EĞRİSİ
          </span>
          <span class="text-[10px] text-gray-600">Cumulative R</span>
        </div>
        <div class="flex-grow relative w-full h-full min-h-[80px]">
          <canvas id="rChart"></canvas>
        </div>
      </div>

    </div>

    <!-- FILTER BAR -->
    <div class="glass-card p-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center gap-3 w-full lg:w-auto">
        <div class="relative w-full lg:w-64">
          <i data-lucide="search" class="w-4 h-4 absolute left-3 top-2.5 text-gray-500"></i>
          <input type="text" id="searchInput" placeholder="Parite, not, model ara..." oninput="renderTrades()" class="w-full bg-[#0d1117] border border-gray-700 rounded-lg pl-9 pr-3 py-2 text-sm text-gray-300 focus:outline-none focus:border-emerald-500 placeholder-gray-600">
        </div>
        <select id="filterDirection" onchange="renderTrades()" class="bg-[#0d1117] border border-gray-700 rounded-lg px-3 py-2 text-sm text-gray-400 focus:outline-none focus:border-emerald-500">
          <option value="ALL">Tüm Yönler</option>
          <option value="LONG">Sadece Long</option>
          <option value="SHORT">Sadece Short</option>
        </select>
      </div>
      <div class="flex items-center gap-2 text-sm text-gray-400">
        <i data-lucide="arrow-down-up" class="w-4 h-4"></i>
        <span>Sırala:</span>
        <select id="sortOrder" onchange="renderTrades()" class="bg-[#0d1117] border border-gray-700 rounded-lg px-2 py-1 text-sm text-gray-300 focus:outline-none">
          <option value="NEWEST">En Yeni İşlem</option>
          <option value="OLDEST">En Eski İşlem</option>
          <option value="HIGHEST_R">En Yüksek R</option>
          <option value="LOWEST_R">En Düşük R</option>
        </select>
      </div>
    </div>

    <!-- TRADES GRID -->
    <div id="tradesContainer" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-4 gap-5">
      <!-- Dinamik Kartlar -->
    </div>

  </main>

  <!-- YENİ İŞLEM MODALI -->
  <div id="tradeModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">
    <div class="bg-[#161b22] border border-gray-700 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden flex flex-col max-h-[90vh]">
      <div class="px-6 py-4 border-b border-gray-800 flex justify-between items-center bg-[#0d1117]">
        <h2 class="font-bold text-white flex items-center gap-2">
          <div class="bg-emerald-500/20 text-emerald-400 p-1.5 rounded"><i data-lucide="plus" class="w-5 h-5"></i></div>
          Yeni SMC İşlemi Kaydet
        </h2>
        <button onclick="closeModal()" type="button" class="text-gray-500 hover:text-white transition"><i data-lucide="x" class="w-6 h-6"></i></button>
