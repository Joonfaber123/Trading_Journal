<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMC & PA Trading Journal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .custom-scroll::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: #1e293b;
      border-radius: 4px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-12 custom-scroll selection:bg-indigo-500 selection:text-white">

  <!-- Top Navbar -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-40 px-4 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center space-x-3">
      <div class="bg-indigo-600/20 text-indigo-400 p-2 rounded-xl border border-indigo-500/30">
        <i data-lucide="line-chart" class="w-6 h-6"></i>
      </div>
      <div>
        <h1 class="font-bold text-lg leading-tight text-white flex items-center gap-2">
          SMC Trade Journal
          <span class="text-xs bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 px-2 py-0.5 rounded-full font-mono">v2.0</span>
        </h1>
        <p class="text-xs text-slate-400">Price Action & R-Multiple Kayıt Sistemi</p>
      </div>
    </div>

    <!-- Günlük Değiştirici & Aksiyonlar -->
    <div class="flex items-center flex-wrap gap-2.5">
      <div class="flex items-center bg-slate-800/80 border border-slate-700 rounded-lg px-2.5 py-1">
        <i data-lucide="book-marked" class="w-4 h-4 text-slate-400 mr-2"></i>
        <select id="journalSelect" onchange="switchJournal(this.value)" class="bg-transparent text-sm text-slate-200 outline-none cursor-pointer pr-2">
          <!-- Dinamik Liste -->
        </select>
        <button onclick="openNewJournalModal()" title="Yeni Günlük Aç" class="text-indigo-400 hover:text-indigo-300 ml-1.5 p-1 rounded hover:bg-slate-700/50">
          <i data-lucide="plus-circle" class="w-4 h-4"></i>
        </button>
      </div>

      <button onclick="clearCurrentJournal()" class="flex items-center text-xs bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 border border-rose-500/30 px-3 py-1.5 rounded-lg transition">
        <i data-lucide="trash-2" class="w-3.5 h-3.5 mr-1.5"></i>
        Bu Günlüğü Sıfırla
      </button>

      <button onclick="exportData()" class="flex items-center text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 border border-slate-700 px-3 py-1.5 rounded-lg transition">
        <i data-lucide="download" class="w-3.5 h-3.5 mr-1.5"></i>
        Yedek İndir
      </button>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto px-4 lg:px-8 mt-6 grid grid-cols-1 lg:grid-cols-12 gap-6 flex-grow">

    <!-- SOL: Yeni İşlem Formu (4 Kolon) -->
    <section class="lg:col-span-4 bg-slate-900/50 border border-slate-800/80 rounded-2xl p-5 h-fit shadow-xl">
      <div class="flex items-center justify-between pb-3 mb-4 border-b border-slate-800">
        <h2 class="font-semibold text-slate-200 flex items-center gap-2 text-base">
          <i data-lucide="plus-square" class="w-5 h-5 text-indigo-400"></i>
          Yeni Trade Ekle
        </h2>
        <span id="activeJournalBadge" class="text-xs text-slate-400 bg-slate-800 px-2 py-0.5 rounded">Varsayılan</span>
      </div>

      <form id="tradeForm" onsubmit="saveTrade(event)" class="space-y-4">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Parite</label>
            <input type="text" id="symbol" placeholder="Örn: EURUSD, BTC" required class="w-full uppercase bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Yön</label>
            <select id="direction" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="LONG">🟢 Long</option>
              <option value="SHORT">🔴 Short</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Setup / Model</label>
            <select id="model" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
              <option value="FVG">Fair Value Gap (FVG)</option>
              <option value="Order Block">Order Block (OB)</option>
              <option value="Breaker Block">Breaker Block</option>
              <option value="Liquidity Sweep">Liquidity Sweep</option>
              <option value="Range Deviation">Range Deviation</option>
              <option value="CHoCH / MSS">CHoCH / MSS</option>
              <option value="Diğer">Diğer PA Modeli</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-400 mb-1">Net Alınan R</label>
            <input type="number" step="0.01" id="rMultiple" placeholder="Örn: 2.5 veya -1" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
          </div>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">İşlem Tarihi</label>
          <input type="datetime-local" id="tradeDate" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- Ekran Görüntüsü Yükleme -->
        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Ekran Görüntüsü (Görsel veya Link)</label>
          <div class="border border-dashed border-slate-700 hover:border-indigo-500/60 rounded-xl p-3 text-center bg-slate-800/40 cursor-pointer relative">
            <input type="file" id="imageFile" accept="image/*" onchange="handleImageUpload(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div id="uploadPlaceholder" class="flex flex-col items-center justify-center py-2 text-slate-400">
              <i data-lucide="image-plus" class="w-6 h-6 mb-1 text-slate-500"></i>
              <span class="text-xs">Fotoğraf seç veya sürükle</span>
            </div>
            <div id="imagePreviewContainer" class="hidden relative">
              <img id="imagePreview" src="" alt="Önizleme" class="h-28 mx-auto rounded-lg object-cover border border-slate-700">
              <button type="button" onclick="removeImage(event)" class="absolute -top-2 -right-2 bg-rose-500 text-white rounded-full p-1 shadow hover:bg-rose-600">
                <i data-lucide="x" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
          <input type="url" id="imageUrl" placeholder="veya TradingView görsel linki yapıştır" class="mt-2 w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Setup Mantığı (HTF Bias, Likidite vb.)</label>
          <textarea id="notes" rows="2" placeholder="Neden işleme girdin? Hangi likidite alındı?" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <div>
          <label class="block text-xs font-medium text-slate-400 mb-1">Hatalar / Psikoloji / Çıkarılan Ders</label>
          <textarea id="psychology" rows="2" placeholder="Erken mi kapattın? Kural ihlali var mı?" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-xs text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500"></textarea>
        </div>

        <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-medium py-2.5 rounded-xl text-sm transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
          <i data-lucide="check" class="w-4 h-4"></i>
          İşlemi Kaydet
        </button>
      </form>
    </section>

    <!-- SAĞ: İstatistikler, R Grafiği ve İşlem Kartları (8 Kolon) -->
    <section class="lg:col-
